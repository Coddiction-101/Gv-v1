<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>GitVerse MVP</title>
</head>

<body>
  <main>
    <h1>GitVerse.</h1>
    <p>Search a public GitHub profile and view its repositories.</p>

    <form id="search-form">
      <label for="username">GitHub username</label>
      <input id="username" name="username" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <section id="profile" hidden>
      <img id="avatar" alt="">
      <div>
        <h2 id="name"></h2>
        <p id="bio"></p>
        <a id="github-link" target="_blank" rel="noreferrer">View GitHub profile</a>
      </div>
    </section>

    <section id="repositories" hidden>
      <h2>Repositories</h2>
      <ul id="repo-list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
